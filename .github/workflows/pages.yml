# Publishes the site/ folder on GitHub Pages every time you push a change to it.
# The site then lives at https://danielellow.github.io/mili/
#
# One-time setup on github.com: the repository's Settings → Pages →
# "Build and deployment" → Source: GitHub Actions.
# You can follow each run under the repository's Actions tab.

name: Publish the site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:        # also lets you start it by hand from the Actions tab

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
