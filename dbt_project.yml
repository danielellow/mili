# The dbt project for mili.
# dbt turns the raw MusicBrainz files into clean tables, in three layers:
#   bronze = raw data, just made readable as rows
#   silver = cleaned, one row per thing (release, album, link ...)
#   gold   = the finished tables the app and the analysis read from

name: mili
version: "0.1.0"
config-version: 2
profile: mili

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

vars:
  # where the Python scripts save the raw files
  raw_dir: "data/raw"
  # A release on a label's Bandcamp page that matches no MusicBrainz work, but
  # whose title is at least this similar to one, waits for a decision instead
  # of becoming an object of its own (see silver_bandcamp_unmatched)
  bandcamp_uncertain_from: 0.85

models:
  mili:
    +materialized: table   # every model is saved as a real table in DuckDB

seeds:
  mili:
    labels:
      +column_types:
        label_name: varchar
        musicbrainz_id: varchar
        mili_label: varchar
        notes: varchar
    platforms:
      +column_types:
        platform_id: varchar
        display_name: varchar
        listen: boolean
        buy: boolean
        default_order: integer
        # false = only for DJ mixes (Mixcloud), never as a release link
        for_releases: boolean
    platform_domains:
      +column_types:
        domain: varchar
        platform_id: varchar
    label_bandcamp_pages:
      +column_types:
        mili_label: varchar
        bandcamp_url: varchar
        notes: varchar
    match_confidence:
      +column_types:
        method: varchar
        confidence: double
        how_the_match_was_made: varchar
    mixes:
      +column_types:
        mix_url: varchar
        title: varchar
        artist: varchar
        artwork_url: varchar
        notes: varchar
