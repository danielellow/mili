# Descriptions and tests for every model.
# `dbt build` runs the tests automatically: e.g. "unique" checks that no ID
# appears twice, "relationships" checks that every ID points to something real.

version: 2

models:

  - name: bronze_mb_releases
    description: Every release exactly as MusicBrainz sent it, one row per release per fetch run.
    columns:
      - name: release_id
        data_tests: [not_null]

  - name: silver_mb_releases
    description: One row per release (edition), newest fetch only, with the useful fields as columns.
    columns:
      - name: release_id
        data_tests: [unique, not_null]
      - name: release_group_id
        data_tests: [not_null]

  - name: silver_mb_release_groups
    description: One row per release group, which mili treats as a work.
    columns:
      - name: release_group_id
        data_tests: [unique, not_null]

  - name: silver_mb_release_group_genres
    description: Community-voted genres per work.

  - name: silver_mb_release_labels
    description: The labels each release is on, with catalogue numbers, marking our seed labels.

  - name: silver_mb_urls
    description: Every link MusicBrainz knows for our releases and works, matched to a platform where possible.
    columns:
      - name: url
        data_tests: [not_null]
      - name: level
        data_tests:
          - accepted_values:
              arguments:
                values: ['edition', 'album']

  - name: bronze_barcode_lookups
    description: Every answer from the Apple, Deezer and Spotify barcode lookups, as saved by the lookup script.
    columns:
      - name: work_id
        data_tests: [not_null]

  - name: silver_platform_matches
    description: Newest lookup answer per work and platform, with the match check (exact barcode, or title check for other barcodes).
    columns:
      - name: match_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['found', 'not_found']
      - name: platform_id
        data_tests:
          - relationships:
              arguments:
                to: ref('platforms')
                field: platform_id

  - name: gold_platform_match_summary
    description: Per platform, how the barcode lookups went (found, matched on barcode, accepted on title, rejected).

  - name: bronze_deezer_title_search
    description: Every answer from the Deezer artist + title search, as saved by the search script.
    columns:
      - name: work_id
        data_tests: [not_null]

  - name: silver_deezer_title_matches
    description: Best Deezer candidate per searched work, accepted only if both artist and title match closely.
    columns:
      - name: work_id
        data_tests: [unique, not_null]

  - name: gold_title_search_summary
    description: How the Deezer title search went, split by whether the work has a barcode.

  - name: bronze_bandcamp_collection
    description: Every item on your saved Bandcamp collection page, as read by ingest/read_bandcamp_collection.py.

  - name: silver_bandcamp_collection
    description: Your Bandcamp collection (newest saved page, without hidden items), each item matched to a MusicBrainz work, a Bandcamp-only object, or new.
    columns:
      - name: bandcamp_id
        data_tests: [unique, not_null]
      - name: decision
        data_tests:
          - accepted_values:
              arguments:
                values: ['matched_work', 'matched_bandcamp_page', 'new']

  - name: bronze_apple_title_search
    description: Every answer from the Apple Music artist + title search, as saved by ingest/search_apple_by_title.py.
    columns:
      - name: work_id
        data_tests: [not_null]

  - name: silver_apple_title_matches
    description: Best Apple Music candidate per searched work, accepted only if both artist and title match closely.
    columns:
      - name: work_id
        data_tests: [unique, not_null]

  - name: bronze_bandcamp_label_items
    description: Every release listed on the labels' own Bandcamp pages, as saved by the page script.
    columns:
      - name: item_url
        data_tests: [not_null]

  - name: silver_bandcamp_label_matches
    description: Each release on a label's Bandcamp page, matched to one of that label's works (or not, if MusicBrainz doesn't have it).
    columns:
      - name: match_id
        data_tests: [unique, not_null]
      - name: item_url
        data_tests: [not_null]

  - name: bronze_odesli_links
    description: Every answer from Odesli (song.link), as saved by the Odesli script.
    columns:
      - name: work_id
        data_tests: [not_null]

  - name: silver_odesli_links
    description: One row per platform link Odesli gave for a work, with a title check against MusicBrainz.
    columns:
      - name: link_id
        data_tests: [unique, not_null]

  - name: gold_odesli_summary
    description: Per platform, how many links Odesli added and how many passed the title check.

  - name: gold_bandcamp_page_summary
    description: Per label, what reading its own Bandcamp page added, and how many releases are missing from MusicBrainz.

  - name: bronze_discogs_lookups
    description: Every answer from Discogs (edition lookups and searches), as saved by the Discogs script.
    columns:
      - name: work_id
        data_tests: [not_null]

  - name: silver_discogs_matches
    description: Per looked-up work, the Discogs edition and main page (master) we found, and whether we trust it.
    columns:
      - name: work_id
        data_tests: [unique, not_null]
      - name: method
        data_tests:
          - accepted_values:
              arguments:
                values: ['release_lookup', 'barcode_search', 'title_search']

  - name: gold_discogs_summary
    description: Per label, where each work's Discogs link comes from (MusicBrainz, our lookup, or a search fallback).

  - name: gold_works
    description: One row per work (album, EP, single ...), with top genres and its Discogs link. Every work has a Discogs link, at worst a ready-made search.
    columns:
      - name: work_id
        data_tests: [unique, not_null]
      - name: discogs_url
        data_tests: [not_null]
      - name: discogs_page_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['master', 'release', 'search']

  - name: gold_buy_options
    description: What the app's "buy" menu shows for each object, Bandcamp (when we have a link) and Discogs (always, for releases), in menu order. Mixes have none.
    columns:
      - name: buy_option_id
        data_tests: [unique, not_null]
      - name: url
        data_tests: [not_null]
      - name: object_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('gold_objects')
                field: object_id
      - name: work_id
        data_tests:
          - relationships:
              arguments:
                to: ref('gold_works')
                field: work_id

  - name: silver_bandcamp_unmatched
    description: Releases on the labels' Bandcamp pages that aren't linked to any MusicBrainz work, decided as bandcamp_only (becomes an object) or uncertain (waits for a decision).
    columns:
      - name: url_key
        data_tests: [unique, not_null]
      - name: decision
        data_tests:
          - accepted_values:
              arguments:
                values: ['bandcamp_only', 'uncertain']

  - name: silver_mixes
    description: The mixes added by hand in seeds/mixes.csv, with the platform of each link.
    columns:
      - name: url_key
        data_tests: [unique, not_null]

  - name: gold_objects
    description: One row per mili object, with mili's own ID. Objects come from MusicBrainz works, Bandcamp-only releases and mixes added by hand.
    columns:
      - name: object_id
        data_tests: [unique, not_null]
      - name: born_from
        data_tests: [unique, not_null]
      - name: work_id
        data_tests: [unique]
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: ['release', 'mix']
      - name: identity_source
        data_tests:
          - accepted_values:
              arguments:
                values: ['musicbrainz', 'bandcamp_page', 'added_by_hand', 'bandcamp_collection']

  - name: gold_object_labels
    description: Which objects belong to which mili label.
    columns:
      - name: object_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('gold_objects')
                field: object_id
      - name: mili_label
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('labels')
                field: mili_label

  - name: gold_object_instances
    description: Every place an object lives, one row per object and link. The app reads this; gold_instances stays keyed by MusicBrainz work for the lookup scripts.
    columns:
      - name: instance_id
        data_tests: [unique, not_null]
      - name: confidence
        data_tests: [not_null]
      - name: version_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('gold_object_versions')
                field: version_id
      - name: object_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('gold_objects')
                field: object_id
      - name: platform_id
        data_tests:
          - relationships:
              arguments:
                to: ref('platforms')
                field: platform_id

  - name: silver_link_versions
    description: Which version of a work each link is (standard, Deluxe Version, Remastered ...), read from the title the platform shows.

  - name: gold_object_versions
    description: The versions of each object ("Wind", "Wind (Deluxe Version)"), with which one the page shows first (is_main).
    columns:
      - name: version_id
        data_tests: [unique, not_null]
      - name: object_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('gold_objects')
                field: object_id

  - name: gold_listen_options
    description: The row of listen links on a release or mix page, one link per platform, in the platforms seed's order.
    columns:
      - name: listen_option_id
        data_tests: [unique, not_null]
      - name: object_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('gold_objects')
                field: object_id

  - name: gold_site_objects
    description: One row per object with everything the website shows (labels, artist IDs, genres, availability, listen links, buy menu, versions). export/export_site_data.py writes it as JSON.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: availability
        data_tests:
          - accepted_values:
              arguments:
                values: ['bandcamp_and_streaming', 'streaming_only', 'bandcamp_only', 'elsewhere', 'nowhere']

  - name: silver_library
    description: Your library (seeds/library.csv and your Bandcamp collection), each row matched to a mili object. Rows from the file that aren't found have an empty object_id and a check_note.
    columns:
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['collection', 'queue']

  - name: gold_library
    description: Your library, one row per object, with when it was added, collection or queue, and your collages.
    columns:
      - name: object_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('gold_objects')
                field: object_id

  - name: gold_object_summary
    description: Per label, how many objects come from MusicBrainz, how many only from the label's Bandcamp page, and how many Bandcamp releases wait for a decision.

  - name: gold_claims
    description: One row per fact (title, artist, release date) per source about an object, with where it came from and a confidence. Disagreeing claims sit side by side.
    columns:
      - name: claim_id
        data_tests: [unique, not_null]
      - name: object_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('gold_objects')
                field: object_id
      - name: predicate
        data_tests:
          - accepted_values:
              arguments:
                values: ['title', 'artist', 'release_date', 'uploaded_by']
      - name: scope
        data_tests:
          - accepted_values:
              arguments:
                values: ['work', 'platform', 'edition']
      - name: confidence
        description: Empty would mean a match method is missing from seeds/match_confidence.csv.
        data_tests: [not_null]

  - name: gold_claim_comparisons
    description: Every claim from another source compared with MusicBrainz (same, only brackets differ, one contains the other, different; same year, later, earlier; or who uploaded it).
    columns:
      - name: claim_id
        data_tests: [unique, not_null]

  - name: gold_claim_summary
    description: Per label, fact and source, how often the source agrees with MusicBrainz. The "(all labels)" rows are the totals.

  - name: gold_upload_summary
    description: Who uploaded the releases on YouTube, YouTube Music and SoundCloud (the artist, the label, YouTube's automatic channels, or someone else), per label and platform.

  - name: gold_label_works
    description: Which works belong to which mili label.
    columns:
      - name: mili_label
        data_tests: [not_null]
      - name: work_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('gold_works')
                field: work_id

  - name: gold_instances
    description: Each place a work lives on one of our platforms, from MusicBrainz links, accepted barcode lookups, accepted Deezer title searches, the labels' own Bandcamp pages, Odesli and Discogs lookups, with how it was matched and a confidence from 0 to 1.
    columns:
      - name: instance_id
        data_tests: [unique, not_null]
      - name: confidence
        description: Empty would mean a match method is missing from seeds/match_confidence.csv.
        data_tests: [not_null]
      - name: work_id
        data_tests:
          - relationships:
              arguments:
                to: ref('gold_works')
                field: work_id
      - name: platform_id
        data_tests:
          - relationships:
              arguments:
                to: ref('platforms')
                field: platform_id

  - name: gold_label_platform_coverage
    description: For each label and platform, the share of works with a known link (first analysis table).

seeds:

  - name: labels
    description: The seed labels and their MusicBrainz IDs, chosen by hand.
    columns:
      - name: musicbrainz_id
        data_tests: [unique, not_null]

  - name: platforms
    description: The platforms mili links to, in the default display order. for_releases = false marks platforms that are only for DJ mixes (Mixcloud).
    columns:
      - name: platform_id
        data_tests: [unique, not_null]

  - name: label_bandcamp_pages
    description: Each label's own Bandcamp page(s), checked by hand. A label can have several pages, or none (empty address).
    columns:
      - name: bandcamp_url
        data_tests: [unique]
      - name: mili_label
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('labels')
                field: mili_label

  - name: match_confidence
    description: Each way of matching a source to a work, with how sure we are of it (0 to 1). A first suggestion, to adjust using the precision check.
    columns:
      - name: method
        data_tests: [unique, not_null]
      - name: confidence
        data_tests: [not_null]

  - name: library
    description: Your library, one release or mix per row, pointed to by a link or by artist and title (see silver_library).

  - name: mixes
    description: Mixes added by hand (NTS, Mixcloud ...), each with its link, title, DJ or show, and artwork. Each becomes a mili object.
    columns:
      - name: mix_url
        data_tests: [unique, not_null]

  - name: platform_domains
    description: Web domains used to recognise each platform in a link.
    columns:
      - name: domain
        data_tests: [unique, not_null]
      - name: platform_id
        data_tests:
          - relationships:
              arguments:
                to: ref('platforms')
                field: platform_id
