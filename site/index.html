<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mili</title>
  <meta name="description" content="mili (milieu): a music library outside any platform.">
  <link rel="icon" href="icons/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/" title="mili: the catalogue"><span class="mi logo" style="--src:url(icons/logomark.svg)" aria-hidden="true"></span><span class="sr">mili</span></a>
    <nav class="iconbar">
      <a href="#/library?show=queue" data-page="queue" title="queue"><span class="mi" style="--src:url(icons/queue.svg)" aria-hidden="true"></span><span class="sr">queue</span></a>
      <a href="#/library" data-page="library" title="library"><span class="mi" style="--src:url(icons/collect.svg)" aria-hidden="true"></span><span class="sr">library</span></a>
      <a href="#/atlas" data-page="atlas" title="atlas"><span class="mi" style="--src:url(icons/network.svg)" aria-hidden="true"></span><span class="sr">atlas</span></a>
      <a href="#/garden" data-page="garden" title="garden"><span class="mi" style="--src:url(icons/garden.svg)" aria-hidden="true"></span><span class="sr">garden</span></a>
      <button id="search-button" class="search-button" title="search (press /)"><span class="mi" style="--src:url(icons/plus.svg)" aria-hidden="true"></span><span class="sr">search</span></button>
      <span id="rotation-bar" class="rotation-bar" hidden></span>
    </nav>
    <button id="menu-button" class="menu-button" aria-label="menu" aria-expanded="false"><span class="mi" style="--src:url(icons/menu.svg)" aria-hidden="true"></span></button>
    <div id="menu" class="dropdown" hidden>
      <a href="#/about">about</a>
      <a id="menu-profile" href="#/profile" hidden>profile</a>
      <a href="#/settings">settings</a>
      <a href="#/guide">guide</a>
      <a id="menu-account" href="#/sign-in" hidden>sign in</a>
    </div>
  </header>
  <main id="view"></main>
</body>
</html>
